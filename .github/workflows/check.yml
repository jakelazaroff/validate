name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: |
          source .github/workflows/actions.sh
          step run: "npm install"
          step run: "npx prettier ./*.js --check"
          step run: "npm test"
          step run: "npm run typecheck"
